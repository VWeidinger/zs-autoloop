[project]
name = "ldb_models"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Johannes Wehrstein", email = "johannes.wehrstein@cs.tu-darmstadt.de" }
]
dependencies = [
    "pydantic>=2.8.2",
    "osfclient>=0.0.5",
    "scikit-learn>=1.5.1",
    "torch==2.3.0",
    "lightning>=2.4.0",
    "polars>=1.6.0",
    "pandas>=2.2.2",
    "dgl @ https://data.dgl.ai/wheels/torch-2.3/cu121/dgl-2.4.0%2Bcu121-cp312-cp312-manylinux1_x86_64.whl ; platform_system == 'Linux'",
    "dgl @ https://data.dgl.ai/wheels/dgl-2.2.0-cp312-cp312-macosx_12_0_arm64.whl ; platform_system == 'Darwin'",
    "ldb_schema @ git+https://github.com/DataManagementLab/ldb_schema.git",
    "pytest>=8.3.3",
    "matplotlib>=3.9.2",
    "wandb>=0.20.1",
    "seaborn>=0.13.2",
    "plotly>=5.24.1",
    "jupyter>=1.1.1",
    "notebook>=7.2.2",
    "orjson>=3.10.12",
    "python-dotenv>=1.0.1",
    "attrs>=24.2.0",
    "tabulate>=0.9.0",
    "loralib>=0.1.2",
    "fast-soft-sort @ git+https://github.com/google-research/fast-soft-sort.git",
    "numba>=0.60.0",
    "gensim>=4.3.3",
    "lightgbm>=4.5.0",
    "duckdb>=1.1.3",
    "wandb-workspaces>=0.1.8",
    "schedulefree>=1.4",
    "ipywidgets>=8.1.7",
    "statsmodels",
    "torchdata==0.8.0",
    "setup @ git+https://github.com/DataManagementLab/SPFlow.git",
    "torch-scatter>=2.1.2",
    "octopus @ git+https://github.com/DataManagementLab/octopus.git",
]
readme = "README.md"
requires-python = "~= 3.12.0"

[project.optional-dependencies]
jupyter = [
    "notebook>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# [tool.rye]
# managed = true
# dev-dependencies = [   
# #    "dgl @ https://data.dgl.ai/wheels/dgl-2.2.1-cp312-cp312-win_amd64.whl",
# ]

# [[tool.rye.sources]]
# name = 'dgl'
# url = 'https://data.dgl.ai/wheels/repo.html'
# type = "find-links"

[tool.uv]

[tool.uv.sources]
# Install CUDA-enabled PyTorch wheels on Linux.
torch = { index = "pytorch-cuda", marker = "platform_system == 'Linux'" }

# Avoid building torch-scatter from source under build isolation by using the
# official prebuilt PyG wheels for the matching Torch/CUDA combo.
torch-scatter = [
    { index = "pyg-cuda", marker = "platform_system == 'Linux'" },
    { index = "pyg-cpu", marker = "platform_system == 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.3.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cuda"
url = "https://data.pyg.org/whl/torch-2.3.0+cu121.html"
format = "flat"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ldb_models"]
