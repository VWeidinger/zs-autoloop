[project]
name = "ldb_models"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Johannes Wehrstein", email = "johannes.wehrstein@cs.tu-darmstadt.de" }
]
dependencies = [
    "pydantic>=2.8.2",
    "osfclient>=0.0.5",
    "scikit-learn>=1.5.1",
    "torch==2.3.0",
    "lightning>=2.4.0",
    "polars>=1.6.0",
    "pandas>=2.2.2",
    "dgl @ https://data.dgl.ai/wheels/torch-2.3/cu121/dgl-2.4.0%2Bcu121-cp312-cp312-manylinux1_x86_64.whl",
    "ldb_schema @ git+https://github.com/DataManagementLab/ldb_schema.git",
    "pytest>=8.3.3",
    "matplotlib>=3.9.2",
    "wandb>=0.18.7",
    "seaborn>=0.13.2",
    "plotly>=5.24.1",
    "jupyter>=1.1.1",
    "notebook>=7.2.2",
    "orjson>=3.10.12",
    "python-dotenv>=1.0.1",
    "attrs>=24.2.0",
    "tabulate>=0.9.0",
    "loralib>=0.1.2",
    "fast-soft-sort @ git+https://github.com/google-research/fast-soft-sort.git",
    "numba>=0.60.0",
    "gensim>=4.3.3",
    "lightgbm>=4.5.0",
    "duckdb>=1.1.3",
]
readme = "README.md"
requires-python = ">= 3.9"

[project.optional-dependencies]
jupyter = [
    "notebook>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "octopus @ git+https://github.com/DataManagementLab/octopus.git",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ldb_models"]
